apiVersion: v1
kind: Service
metadata:
  name: intel-xe-exporter
  namespace: monitoring
  labels:
    app: intel-xe-exporter
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9830"
    prometheus.io/path: "/"
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: intel-xe-exporter
  ports:
    - port: 9830
      targetPort: 9830
      name: metrics
      protocol: TCP